<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · ConectaSocial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <div class="auth-card">
      <h1 id="auth-title">Inicia sesión</h1>
      <p class="sub" id="auth-sub"></p>

      <form id="auth-form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres">
        </div>

        <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
        <button class="btn btn-block" type="submit" id="auth-submit">Entrar</button>
      </form>

      <p class="toggle-row">
        <span id="toggle-text"></span>
        <button class="btn-link" type="button" id="toggle-mode"></button>
      </p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
